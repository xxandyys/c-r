<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form </title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Shared Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Contacts</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Contact Form</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Registration Form</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form Container -->
    <div class="container my-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <h2 class="mb-3 text-center">Get in Touch</h2>
            
            <form class="needs-validation" novalidate>
                <!-- Name Field -->
                <div class="mb-3">
                    <label for="contactName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="contactName" placeholder="Enter your name" required>
                    <div class="invalid-feedback">Please provide your name.</div>
                    <div class="valid-feedback">Looks good!</div>
                </div>

                <!-- Email Field -->
                <div class="mb-3">
                    <label for="contactEmail" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="contactEmail" placeholder="name@example.com" required>
                    <div class="form-text">We'll never share your email with anyone else.</div>
                    <div class="invalid-feedback">Please provide a valid email address.</div>
                    <div class="valid-feedback">Looks good!</div>
                </div>

                <!-- Message Field -->
                <div class="mb-3">
                    <label for="contactMessage" class="form-label">Message</label>
                    <textarea class="form-control" id="contactMessage" rows="4" maxlength="500" placeholder="Type your message here..." required></textarea>
                    <div class="invalid-feedback">Please enter a message (max 500 characters).</div>
                    <div class="valid-feedback">Looks good!</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Bootstrap Validation Script -->
    <script>
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    </script>
</body>
</html>
